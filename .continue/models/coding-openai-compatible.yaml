name: coding-openai-compatible
version: 0.0.1
schema: v1
models:
  - name: Coding - codebase-tooling-mcp Agent API
    provider: openai
    model: models-gpt-5
    apiBase: http://localhost:8000/v1
    roles:
      - chat
      - edit
      - apply
    requestOptions:
      headers:
        Authorization: "Bearer ${{ secrets.MCP_HTTP_BEARER_TOKEN }}"
      timeout: 300000
